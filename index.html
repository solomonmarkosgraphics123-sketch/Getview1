<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>getveiw</title>
  <!-- Google Fonts & Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {

    body {

    .navbar {

    .nav-links {

    .nav-btn {

    .container {
      max-width: 1100px;
      margin: 0 auto;

    }

    .auth-card {
      background: white;
      border-radius: 36px;
      box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.2);
      padding: 2rem 2rem 2.5rem;

    }

    .auth-card h2 {
      font-size: 1.8rem;
      font-weight: 700;

    .input-group {
      margin-bottom: 1.2rem;
    }
    .input-group label {
      font-weight: 500;

    .input-group input {
      width: 100%;
      padding: 12px 16px;

    .btn-primary {

    .switch-text {

    }

    .feed-grid {
      display: flex;
      flex-direction: column;

      margin-top: 10px;
    }

    .post-card {
      background: white;
      border-radius: 28px;
      box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, 0.03);
    }
    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
    }
    .post-user {
      display: flex;
      align-items: center;
      gap: 12px;

    }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;

      border: 2px solid white;

    }
    .username {
      font-weight: 700;
      font-size: 1rem;
      color: #1f2937;
    }
    .follow-btn-sm {
      background: #eff3ff;
      border: none;
      padding: 6px 14px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.75rem;

    }
    .follow-btn-sm.following {

    }
    .media-gallery {
      display: flex;
      overflow-x: auto;
      gap: 8px;

      background: #f8fafc;
      scroll-snap-type: x mandatory;
    }
    .media-gallery img, .media-gallery video {
      max-height: 450px;
      width: auto;
      scroll-snap-align: start;

    }
    .single-media {
      width: 100%;
      max-height: 500px;
      display: flex;
      justify-content: center;
      background: #f8fafc;
    }
    .single-media img, .single-media video {
      max-width: 100%;
      max-height: 500px;
      object-fit: contain;
    }
    .post-caption {
      padding: 12px 20px 4px;
      font-size: 0.9rem;
      color: #2d3a4b;
    }
    .post-actions {
      display: flex;
      gap: 28px;
      padding: 12px 20px 8px;
      border-top: 1px solid #edf2f7;

    }
    .action-btn {
      background: none;
      border: none;
      display: flex;
      align-items: center;

      font-weight: 500;

    .action-btn.liked {

    }
    .action-btn i {

    .comments-section {

    .comment-list {
      max-height: 200px;
      overflow-y: auto;

    }
    .comment-item {
      font-size: 0.85rem;

    }
    .comment-user {

    }
    .comment-text {
      color: #1f2937;
      word-break: break-word;
    }
    .comment-form {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }
    .comment-input {
      flex: 1;
      padding: 8px 14px;
      border-radius: 40px;
      border: 1px solid #e2e8f0;
      background: #fafcff;
      font-size: 0.85rem;
    }
    .comment-submit {
      background: #1e2b6e;
      color: white;
      border: none;
      padding: 6px 16px;
      border-radius: 40px;
      cursor: pointer;
    }

    .profile-header {
      background: white;
      border-radius: 32px;
      padding: 32px;
      margin-bottom: 32px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.02);
    }
    .profile-pic-large {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid white;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }
    .stats {
      display: flex;
      gap: 32px;
      margin: 18px 0 12px;
    }
    .stat {
      text-align: center;
    }
    .stat-num {
      font-weight: 800;
      font-size: 1.5rem;
    }
    .profile-actions {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .posts-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }
    .gallery-item {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 6px 12px -8px rgba(0,0,0,0.1);
    }
    .gallery-media {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      cursor: pointer;
    }
    .new-post-area {
      background: white;
      border-radius: 28px;
      padding: 20px;
      margin-bottom: 30px;
    }
    .upload-option {
      margin: 12px 0;
    }
    .file-label {
      background: #eef2ff;
      padding: 10px 16px;
      border-radius: 34px;
      cursor: pointer;
      display: inline-block;
      margin-right: 10px;
    }
    textarea {
      width: 100%;
      border-radius: 28px;
      border: 1px solid #ddd;
      padding: 12px;
      resize: vertical;
    }
    .loading-trigger {
      text-align: center;
      padding: 20px;
      color: #5b6e8c;
    }
    .logout-btn {
      background: rgba(220, 53, 69, 0.1);
      color: #dc3545;
    }
    .logout-btn:hover {

    }
    @media (max-width: 680px) {
      .navbar { padding: 0.8rem 1rem; }
      .post-header { flex-wrap: wrap; }

  </style>
</head>
<body>
<div id="appRoot"></div>

<script>
  // ---------- STORAGE KEYS ----------
  const STORAGE_USERS = "social_users";
  const STORAGE_POSTS = "social_posts";
  const STORAGE_FOLLOWS = "social_follows";
  const STORAGE_CURRENT = "social_current_user";
  const STORAGE_DEVICE_ID = "device_fingerprint";
  const STORAGE_DEVICE_LIKES = "social_device_likes";

  let currentUser = null;
  let allUsers = [];
  let allPosts = [];        // each post: {id, userId, mediaType, mediaData (array or string), caption, timestamp, views, comments}
  let followRelations = [];
  let postDeviceLikes = {};
  let currentDeviceId = null;
  let feedVisibleCount = 6;
  let isLoadingMore = false;

  function getOrCreateDeviceId() {
    let deviceId = localStorage.getItem(STORAGE_DEVICE_ID);
    if (!deviceId) {
      deviceId = 'dev_' + Date.now() + '_' + Math.random().toString(36) + '_' + navigator.userAgent.slice(0, 20);
      localStorage.setItem(STORAGE_DEVICE_ID, deviceId);
    }
    return deviceId;
  }

  function persistData() {
    localStorage.setItem(STORAGE_USERS, JSON.stringify(allUsers));
    localStorage.setItem(STORAGE_POSTS, JSON.stringify(allPosts));
    localStorage.setItem(STORAGE_FOLLOWS, JSON.stringify(followRelations));
    localStorage.setItem(STORAGE_DEVICE_LIKES, JSON.stringify(postDeviceLikes));
    if (currentUser) localStorage.setItem(STORAGE_CURRENT, JSON.stringify(currentUser));
    else localStorage.removeItem(STORAGE_CURRENT);
  }

  function initDemoData() {
    if (allUsers.length === 0) {
      const demoUser1 = { id: "u1", email: "alex.wander@gmail.com", username: "AlexWander", password: "123", profilePic: "https://randomuser.me/api/portraits/men/32.jpg" };
      const demoUser2 = { id: "u2", email: "jessie.c@gmail.com", username: "JessieCreative", password: "123", profilePic: "https://randomuser.me/api/portraits/women/68.jpg" };
      const demoUser3 = { id: "u3", email: "marcus.t@gmail.com", username: "MarcusT", password: "123", profilePic: "https://randomuser.me/api/portraits/men/45.jpg" };
      allUsers = [demoUser1, demoUser2, demoUser3];
      const now = Date.now();
      allPosts = [
        { id: "p1", userId: "u1", mediaType: "image_gallery", mediaData: ["https://picsum.photos/id/1015/600/400"], caption: "Mountain vibes ⛰️", timestamp: now - 3600000, views: [], comments: [] },
        { id: "p2", userId: "u2", mediaType: "image_gallery", mediaData: ["https://picsum.photos/id/20/600/400"], caption: "Coffee & dev ☕", timestamp: now - 7200000, views: [], comments: [] },
        { id: "p3", userId: "u3", mediaType: "image_gallery", mediaData: ["https://picsum.photos/id/26/600/400"], caption: "Venice dreams ✨", timestamp: now - 86400000, views: [], comments: [] },
        { id: "p4", userId: "u1", mediaType: "image_gallery", mediaData: ["https://picsum.photos/id/169/600/400"], caption: "Sunset rollercoaster", timestamp: now - 172800000, views: [], comments: [] }
      ];
      followRelations = [
        { followerId: "u2", followingId: "u1" },
        { followerId: "u3", followingId: "u1" }
      ];
      postDeviceLikes = {};
    }
    // ensure each post has comments array
    allPosts.forEach(p => { if (!p.comments) p.comments = []; if (!p.views) p.views = []; });
  }

  function loadDataFromStorage() {
    const storedUsers = localStorage.getItem(STORAGE_USERS);
    const storedPosts = localStorage.getItem(STORAGE_POSTS);
    const storedFollows = localStorage.getItem(STORAGE_FOLLOWS);
    const storedCurrent = localStorage.getItem(STORAGE_CURRENT);
    const storedDeviceLikes = localStorage.getItem(STORAGE_DEVICE_LIKES);
    allUsers = storedUsers ? JSON.parse(storedUsers) : [];
    allPosts = storedPosts ? JSON.parse(storedPosts) : [];
    followRelations = storedFollows ? JSON.parse(storedFollows) : [];
    postDeviceLikes = storedDeviceLikes ? JSON.parse(storedDeviceLikes) : {};
    if (storedCurrent) currentUser = JSON.parse(storedCurrent);
    else currentUser = null;
    if (allUsers.length === 0) initDemoData();
    allPosts.forEach(p => { if (!p.comments) p.comments = []; if (!p.views) p.views = []; });
    persistData();
  }

  function getUserById(id) { return allUsers.find(u => u.id === id); }
  function getPostsByUser(userId) { return allPosts.filter(p => p.userId === userId).sort((a,b)=>b.timestamp - a.timestamp); }
  function getFollowersCount(userId) { return followRelations.filter(rel => rel.followingId === userId).length; }
  function getFollowingCount(userId) { return followRelations.filter(rel => rel.followerId === userId).length; }
  function isFollowing(followerId, followingId) { return followRelations.some(rel => rel.followerId === followerId && rel.followingId === followingId); }
  function followUser(follower, followingId) {
    if (follower === followingId) return false;
    if (!isFollowing(follower, followingId)) {
      followRelations.push({ followerId: follower, followingId });
      persistData();
      return true;
    }
    return false;
  }
  function unfollowUser(follower, followingId) {
    const idx = followRelations.findIndex(rel => rel.followerId === follower && rel.followingId === followingId);
    if (idx !== -1) { followRelations.splice(idx,1); persistData(); return true; }
    return false;
  }

  function toggleLikePost(postId, deviceId) {
    const post = allPosts.find(p => p.id === postId);
    if (!post) return { success: false, liked: false, count: 0 };
    let deviceLikesForPost = postDeviceLikes[postId] || [];
    const alreadyLiked = deviceLikesForPost.includes(deviceId);
    if (!alreadyLiked) {
      deviceLikesForPost.push(deviceId);
      postDeviceLikes[postId] = deviceLikesForPost;
      persistData();
      return { success: true, liked: true, count: deviceLikesForPost.length };
    } else {
      return { success: true, liked: true, count: deviceLikesForPost.length };
    }
  }
  function getLikeCount(postId) { return (postDeviceLikes[postId] || []).length; }
  function isLikedByDevice(postId, deviceId) { return (postDeviceLikes[postId] || []).includes(deviceId); }

  function recordView(postId, userId) {
    const post = allPosts.find(p => p.id === postId);
    if (!post || !userId) return false;
    if (!post.views.includes(userId)) { post.views.push(userId); persistData(); return true; }
    return false;
  }

  function addComment(postId, userId, text) {
    if (!text.trim()) return false;
    const post = allPosts.find(p => p.id === postId);
    if (!post) return false;
    const newComment = {
      id: Date.now() + Math.random().toString(36),
      userId: userId,
      text: text.trim(),
      timestamp: Date.now()
    };
    post.comments.push(newComment);
    persistData();
    return true;
  }

  async function createPostWithMedia(userId, files, caption) {
    if (!files.length) return null;
    // check if first file is video (only 1 video)
    const isVideo = files[0].type.startsWith("video/");
    if (isVideo) {
      if (files.length > 1) { alert("Only one video allowed per post"); return null; }
      const videoDataURL = await readFileAsDataURL(files[0]);
      const newPost = {
        id: "p_" + Date.now() + "_" + Math.random().toString(36),
        userId: userId,
        mediaType: "video",
        mediaData: videoDataURL,
        caption: caption || "",
        timestamp: Date.now(),
        views: [],
        comments: []
      };
      allPosts.unshift(newPost);
      persistData();
      return newPost;
    } else {
      // images: up to 20
      if (files.length > 20) { alert("Maximum 20 images per post"); return null; }
      const imageDataURLs = [];
      for (let file of files) {
        const dataURL = await readFileAsDataURL(file);
        imageDataURLs.push(dataURL);
      }
      const newPost = {
        id: "p_" + Date.now() + "_" + Math.random().toString(36),
        userId: userId,
        mediaType: "image_gallery",
        mediaData: imageDataURLs,
        caption: caption || "",
        timestamp: Date.now(),
        views: [],
        comments: []
      };
      allPosts.unshift(newPost);
      persistData();
      return newPost;
    }
  }

  function readFileAsDataURL(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result);
      reader.readAsDataURL(file);
    });
  }

  function updateUserProfile(userId, newUsername) {
    const user = allUsers.find(u => u.id === userId);
    if (user && newUsername && newUsername.trim()) {
      user.username = newUsername.trim();
      persistData();
      if (currentUser && currentUser.id === userId) currentUser = user;
      return true;
    }
    return false;
  }

  function registerUser(email, username, password, profilePicDataURL = null) {
    if (!email.endsWith("@gmail.com")) return { success: false, msg: "Only Gmail addresses allowed (@gmail.com)" };
    if (allUsers.some(u => u.email === email)) return { success: false, msg: "Email already exists" };
    if (allUsers.some(u => u.username === username)) return { success: false, msg: "Username taken" };
    const newId = "u_" + Date.now() + "_" + Math.random().toString(36);
    const defaultAvatar = "https://ui-avatars.com/api/?background=2a43b6&color=fff&name=" + encodeURIComponent(username);
    const newUser = { id: newId, email, username, password, profilePic: profilePicDataURL || defaultAvatar };
    allUsers.push(newUser);
    persistData();
    return { success: true, user: newUser };
  }
  function loginUser(email, password) {
    const user = allUsers.find(u => u.email === email && u.password === password);
    if (user) return { success: true, user };
    return { success: false, msg: "Invalid credentials" };
  }

  async function downloadMedia(mediaData, mediaType, filename) {
    try {
      let blob;
      if (typeof mediaData === 'string') {
        const response = await fetch(mediaData);
        blob = await response.blob();
      } else if (Array.isArray(mediaData) && mediaData.length) {
        // for gallery, download first image
        const response = await fetch(mediaData[0]);
        blob = await response.blob();
        filename = filename + "_first";
      } else return;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${filename}.${mediaType === 'video' ? 'mp4' : 'jpg'}`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    } catch (err) { alert("Download failed"); }
  }

  function attachViewObserver(postElement, postId, userId) {
    if (!userId) return;
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          recordView(postId, userId);
          const viewSpan = postElement.querySelector('.view-count');
          if (viewSpan) {
            const post = allPosts.find(p => p.id === postId);
            if (post) viewSpan.innerText = post.views.length;
          }
          observer.disconnect();
        }
      });
    }, { threshold: 0.5 });
    observer.observe(postElement);
  }

  // ---------- RENDER ----------
  let currentPage = "feed";
  let selectedProfileUserId = null;

  function renderApp() {
    const root = document.getElementById("appRoot");
    if (!currentUser) renderAuthScreen(root);
    else renderMainLayout(root);
  }

  function renderAuthScreen(root) {
    root.innerHTML = `
      <div class="auth-card">
        <h2 id="authTitle">Welcome back</h2>
        <div>
          <div class="input-group"><label>Email (Gmail)</label><input id="email" type="email" placeholder="yourname@gmail.com"></div>
          <div class="input-group"><label>Username</label><input id="username" placeholder="coolname"></div>
          <div class="input-group"><label>Password</label><input id="password" type="password"></div>
          <div class="input-group" id="profilePicGroup" style="display:none"><label>Profile picture (optional)</label><input id="profilePicFile" type="file" accept="image/*"></div>
          <button id="authSubmitBtn" class="btn-primary">Login</button>
          <p class="switch-text" id="toggleAuthMsg">Don't have an account? <span id="toggleAuth">Sign up</span></p>
        </div>
      </div>
    `;
    let isLogin = true;
    const title = document.getElementById("authTitle");
    const submitBtn = document.getElementById("authSubmitBtn");
    const emailInp = document.getElementById("email");
    const usernameInp = document.getElementById("username");
    const passInp = document.getElementById("password");
    const profileGroup = document.getElementById("profilePicGroup");
    const toggleSpan = document.getElementById("toggleAuth");
    const toggleMsg = document.getElementById("toggleAuthMsg");
    function switchMode() {
      isLogin = !isLogin;
      if (isLogin) {
        title.innerText = "Welcome back";
        submitBtn.innerText = "Login";
        toggleMsg.innerHTML = `Don't have an account? <span id="toggleAuth">Sign up</span>`;
        profileGroup.style.display = "none";
      } else {
        title.innerText = "Create account";
        submitBtn.innerText = "Register";
        toggleMsg.innerHTML = `Already have an account? <span id="toggleAuth">Login</span>`;
        profileGroup.style.display = "block";
      }
      document.getElementById("toggleAuth")?.addEventListener("click", switchMode);
    }
    toggleSpan?.addEventListener("click", switchMode);
    submitBtn.onclick = async () => {
      const email = emailInp.value.trim();
      const username = usernameInp.value.trim();
      const password = passInp.value;
      if (!email || !password) { alert("Fill required fields"); return; }
      if (!isLogin && !username) { alert("Username required"); return; }
      if (isLogin) {
        const res = loginUser(email, password);
        if (res.success) { currentUser = res.user; localStorage.setItem(STORAGE_CURRENT, JSON.stringify(currentUser)); feedVisibleCount = 6; renderApp(); } 
        else alert(res.msg);
      } else {
        if (!email.endsWith("@gmail.com")) { alert("Only Gmail addresses allowed"); return; }
        let profileDataURL = null;
        const fileInput = document.getElementById("profilePicFile");
        if (fileInput.files.length) {
          const file = fileInput.files[0];
          profileDataURL = await new Promise(resolve => { const reader = new FileReader(); reader.onloadend = () => resolve(reader.result); reader.readAsDataURL(file); });
        }
        const reg = registerUser(email, username, password, profileDataURL);
        if (reg.success) { currentUser = reg.user; localStorage.setItem(STORAGE_CURRENT, JSON.stringify(currentUser)); feedVisibleCount = 6; renderApp(); } 
        else alert(reg.msg);
      }
    };
  }

  function renderMainLayout(root) {
    root.innerHTML = `
      <div class="navbar">
        <div class="logo"><i class="fab fa-superpowers"></i> Getview</div>
        <div class="nav-links">
          <button class="nav-btn" id="navFeed"><i class="fas fa-rss"></i> Feed</button>
          <button class="nav-btn" id="navProfile"><i class="fas fa-user-circle"></i> Profile</button>
        </div>
      </div>
      <div class="container" id="mainContent"></div>
    `;
    document.getElementById("navFeed").onclick = () => { currentPage = "feed"; selectedProfileUserId = null; feedVisibleCount = 6; renderPageContent(); };
    document.getElementById("navProfile").onclick = () => { currentPage = "profile"; selectedProfileUserId = currentUser.id; renderPageContent(); };
    renderPageContent();
  }

  async function renderPageContent() {
    const contentDiv = document.getElementById("mainContent");
    if (currentPage === "feed") await renderFeed(contentDiv);
    else if (currentPage === "profile") renderProfile(contentDiv, selectedProfileUserId || currentUser.id);
    else if (currentPage === "otherProfile") renderProfile(contentDiv, selectedProfileUserId);
  }

  async function renderFeed(container) {
    const sortedPosts = [...allPosts].sort((a,b)=>b.timestamp - a.timestamp);
    const limitedPosts = sortedPosts.slice(0, feedVisibleCount);
    container.innerHTML = `<div class="feed-grid" id="feedGrid"></div><div id="loadTrigger" class="loading-trigger">${sortedPosts.length > feedVisibleCount ? 'Scroll for more posts...' : '✨ No more posts'}</div>`;
    const grid = document.getElementById("feedGrid");
    for (let post of limitedPosts) {
      const postCard = createPostCardDOM(post);
      grid.appendChild(postCard);
      attachViewObserver(postCard, post.id, currentUser.id);
    }
    const loadTrigger = document.getElementById("loadTrigger");
    if (loadTrigger) {
      const observer = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && !isLoadingMore && feedVisibleCount < sortedPosts.length) {
          isLoadingMore = true;
          setTimeout(() => { feedVisibleCount = Math.min(feedVisibleCount + 4, sortedPosts.length); renderFeed(container); isLoadingMore = false; }, 200);
        }
      }, { threshold: 0.2 });
      observer.observe(loadTrigger);
    }
  }

  function createPostCardDOM(post) {
    const author = getUserById(post.userId);
    if (!author) return document.createElement("div");
    const currentUserId = currentUser.id;
    const isAuthor = currentUserId === author.id;
    const following = !isAuthor && isFollowing(currentUserId, author.id);
    const likedByDevice = isLikedByDevice(post.id, currentDeviceId);
    const likeCount = getLikeCount(post.id);
    const viewCount = post.views.length;
    const div = document.createElement("div");
    div.className = "post-card";
    
    // Media rendering
    let mediaHtml = "";
    if (post.mediaType === "video") {
      mediaHtml = `<div class="single-media"><video src="${post.mediaData}" controls></video></div>`;
    } else if (post.mediaType === "image_gallery") {
      if (post.mediaData.length === 1) {
        mediaHtml = `<div class="single-media"><img src="${post.mediaData[0]}" alt="post"></div>`;
      } else {
        let galleryItems = post.mediaData.map(src => `<img src="${src}" style="max-height:400px; border-radius:12px;">`).join('');
        mediaHtml = `<div class="media-gallery" style="display:flex; overflow-x:auto; gap:8px; padding:8px;">${galleryItems}</div>`;
      }
    } else { // legacy single image
      mediaHtml = `<div class="single-media"><img src="${post.mediaData}" alt="post"></div>`;
    }
    
    div.innerHTML = `
      <div class="post-header">
        <div class="post-user" data-userid="${author.id}">
          <img class="avatar" src="${author.profilePic}" alt="avatar">
          <span class="username">${escapeHtml(author.username)}</span>
        </div>
        ${!isAuthor ? `<button class="follow-btn-sm ${following ? 'following' : ''}" data-followid="${author.id}">${following ? '✓ Following' : '+ Follow'}</button>` : `<span style="font-size:12px;color:#6c757d">You</span>`}
      </div>
      ${mediaHtml}
      ${post.caption ? `<div class="post-caption">${escapeHtml(post.caption)}</div>` : ''}
      <div class="post-actions">
        <button class="action-btn like-btn ${likedByDevice ? 'liked' : ''}" data-postid="${post.id}"><i class="fas fa-heart"></i> <span class="like-count">${likeCount}</span></button>
        <button class="action-btn download-btn" data-postid="${post.id}" data-mediadata='${JSON.stringify(post.mediaData)}' data-mediatype="${post.mediaType}"><i class="fas fa-download"></i> Download</button>
        <button class="action-btn"><i class="fas fa-eye"></i> <span class="view-count">${viewCount}</span> views</button>
      </div>
      <div class="comments-section" id="comments-${post.id}">
        <div class="comment-list" id="comment-list-${post.id}"></div>
        <div class="comment-form">
          <input type="text" class="comment-input" id="comment-input-${post.id}" placeholder="Write a comment...">
          <button class="comment-submit" data-postid="${post.id}">Post</button>
        </div>
      </div>
    `;
    
    // render comments
    const commentListDiv = div.querySelector(`#comment-list-${post.id}`);
    function renderComments() {
      commentListDiv.innerHTML = '';
      post.comments.slice().reverse().forEach(c => {
        const commentUser = getUserById(c.userId);
        if (!commentUser) return;
        const commentDiv = document.createElement('div');
        commentDiv.className = 'comment-item';
        commentDiv.innerHTML = `<span class="comment-user">${escapeHtml(commentUser.username)}</span><span class="comment-text">${escapeHtml(c.text)}</span>`;
        commentListDiv.appendChild(commentDiv);
      });
    }
    renderComments();
    const submitBtn = div.querySelector('.comment-submit');
    const commentInput = div.querySelector(`#comment-input-${post.id}`);
    submitBtn.onclick = () => {
      const text = commentInput.value;
      if (text.trim()) {
        addComment(post.id, currentUser.id, text);
        commentInput.value = '';
        renderComments();
      }
    };
    
    // follow
    const followBtn = div.querySelector('.follow-btn-sm');
    if (followBtn && !isAuthor) {
      followBtn.onclick = (e) => {
        e.stopPropagation();
        const targetId = followBtn.getAttribute("data-followid");
        if (isFollowing(currentUserId, targetId)) unfollowUser(currentUserId, targetId);
        else followUser(currentUserId, targetId);
        renderPageContent();
      };
    }
    // like
    const likeBtn = div.querySelector('.like-btn');
    likeBtn.onclick = () => {
      const result = toggleLikePost(post.id, currentDeviceId);
      if (result.success) {
        const likeSpan = likeBtn.querySelector('.like-count');
        likeSpan.innerText = result.count;
        if (result.liked) likeBtn.classList.add('liked');
        else likeBtn.classList.remove('liked');
      }
    };
    // download
    const downloadBtn = div.querySelector('.download-btn');
    downloadBtn.onclick = (e) => {
      e.stopPropagation();
      const mediaDataRaw = downloadBtn.getAttribute('data-mediadata');
      let mediaData;
      try { mediaData = JSON.parse(mediaDataRaw); } catch(e) { mediaData = mediaDataRaw; }
      const mediaType = downloadBtn.getAttribute('data-mediatype');
      downloadMedia(mediaData, mediaType, `post_${post.id}`);
    };
    const userHeader = div.querySelector('.post-user');
    userHeader.onclick = () => {
      selectedProfileUserId = author.id;
      currentPage = "otherProfile";
      renderPageContent();
    };
    return div;
  }

  function renderProfile(container, userId) {
    const profileUser = getUserById(userId);
    if (!profileUser) { container.innerHTML = "<div>User not found</div>"; return; }
    const isOwn = currentUser.id === profileUser.id;
    const followersCount = getFollowersCount(profileUser.id);
    const followingCount = getFollowingCount(profileUser.id);
    const userPosts = getPostsByUser(profileUser.id);
    const currentFollows = isOwn ? false : isFollowing(currentUser.id, profileUser.id);
    container.innerHTML = `
      <div class="profile-header">
        <div style="display:flex; align-items:center; gap:24px; flex-wrap:wrap;">
          <img class="profile-pic-large" src="${profileUser.profilePic}" alt="profile">
          <div>
            <h2>${escapeHtml(profileUser.username)}</h2>
            <div class="stats">
              <div class="stat"><div class="stat-num">${followersCount}</div><div>Followers</div></div>
              <div class="stat"><div class="stat-num">${followingCount}</div><div>Following</div></div>
            </div>
            <div class="profile-actions">
              ${!isOwn ? `<button id="profileFollowBtn" class="btn-primary" style="background:${currentFollows ? '#4b5563' : '#1e2b6e'}">${currentFollows ? 'Unfollow' : 'Follow'}</button>` : `<button id="editProfileBtn" class="btn-primary" style="background:#2c3e66;">✏️ Edit Username</button><button id="logoutProfileBtn" class="btn-primary logout-btn" style="background:#dc3545;">🚪 Logout</button>`}
            </div>
          </div>
        </div>
      </div>
      <div class="new-post-area" id="newPostSection" style="${isOwn ? 'display:block' : 'display:none'}">
        <h4>✨ Create new post</h4>
        <div class="upload-option"><label class="file-label"><i class="fas fa-images"></i> Select images (max 20)</label><input type="file" id="postImagesInput" accept="image/*" multiple style="display:none"></div>
        <div class="upload-option"><label class="file-label"><i class="fas fa-video"></i> Select video (1 only)</label><input type="file" id="postVideoInput" accept="video/*" style="display:none"></div>
        <textarea id="postCaption" rows="2" placeholder="Write a caption..."></textarea>
        <button id="uploadPostBtn" class="btn-primary" style="margin-top:12px;">Share post</button>
      </div>
      <h3 style="margin: 20px 0 12px;">📸 Posts gallery</h3>
      <div class="posts-gallery" id="profileGallery"></div>
    `;
    const gallery = document.getElementById("profileGallery");
    userPosts.forEach(post => {
      const galItem = document.createElement("div");
      galItem.className = "gallery-item";
      let preview = "";
      if (post.mediaType === "video") preview = `<video class="gallery-media" src="${post.mediaData}"></video>`;
      else if (post.mediaType === "image_gallery" && post.mediaData.length) preview = `<img class="gallery-media" src="${post.mediaData[0]}">`;
      else preview = `<img class="gallery-media" src="${post.mediaData}">`;
      galItem.innerHTML = preview;
      gallery.appendChild(galItem);
    });
    if (!isOwn && document.getElementById("profileFollowBtn")) {
      document.getElementById("profileFollowBtn").onclick = () => {
        if (isFollowing(currentUser.id, profileUser.id)) unfollowUser(currentUser.id, profileUser.id);
        else followUser(currentUser.id, profileUser.id);
        renderProfile(container, userId);
      };
    }
    if (isOwn) {
      document.getElementById("editProfileBtn")?.addEventListener("click", () => {
        const newName = prompt("New username:", profileUser.username);
        if (newName && newName.trim()) { updateUserProfile(currentUser.id, newName.trim()); renderProfile(container, currentUser.id); }
      });
      document.getElementById("logoutProfileBtn")?.addEventListener("click", () => { currentUser = null; localStorage.removeItem(STORAGE_CURRENT); renderApp(); });
      const imagesInput = document.getElementById("postImagesInput");
      const videoInput = document.getElementById("postVideoInput");
      const captionInp = document.getElementById("postCaption");
      const uploadBtn = document.getElementById("uploadPostBtn");
      document.querySelector(".file-label:first-child")?.addEventListener("click", () => imagesInput.click());
      document.querySelector(".file-label:last-child")?.addEventListener("click", () => videoInput.click());
      uploadBtn.onclick = async () => {
        const imageFiles = imagesInput.files;
        const videoFile = videoInput.files[0];
        let filesToUpload = [];
        if (videoFile) filesToUpload = [videoFile];
        else if (imageFiles.length) filesToUpload = Array.from(imageFiles);
        else { alert("Select at least one image or video"); return; }
        const newPost = await createPostWithMedia(currentUser.id, filesToUpload, captionInp.value);
        if (newPost) { imagesInput.value = ""; videoInput.value = ""; captionInp.value = ""; renderProfile(container, currentUser.id); }
      };
    }
  }

  function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){ return m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'; }); }

  currentDeviceId = getOrCreateDeviceId();
  loadDataFromStorage();
  renderApp();
</script>
</body>
</html>
